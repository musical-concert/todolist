<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liste de tâches ☕</title>
<!-- iOSホーム画面用アイコン設定 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", sans-serif;
            background-color: #f5f0eb;
            min-height: 100vh;
            margin: 0;
            padding: 25px 15px;
            color: #4a3b32;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 10px 25px rgba(100, 80, 70, 0.06);
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            height: fit-content;
        }

        @keyframes popIn {
            0% { transform: scale(0.92) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* アプリ内トースト通知 */
        .toast-notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #70523e;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(112, 82, 62, 0.25);
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 88%;
            max-width: 380px;
            text-align: center;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .toast-notification.show {
            top: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: #70523e;
            font-size: 20px;
            letter-spacing: 1px;
            margin: 0;
            font-weight: 700;
        }

        /* 連続達成日数バッジ */
        .streak-badge {
            background: #fff8e7;
            border: 1px solid #f3e5ab;
            color: #d68910;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* 達成率プログレスバー */
        .progress-box {
            background: #faf6f0;
            border-radius: 18px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #ebe2d8;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: #70523e;
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            background: #e8dfd8;
            height: 8px;
            border-radius: 8px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: #a07855;
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        /* 動物の褒め言葉エリア */
        .pet-praise {
            background: #fff;
            border: 1.5px dashed #d7ccc8;
            border-radius: 16px;
            padding: 10px 12px;
            text-align: center;
            font-weight: 600;
            color: #8c6d58;
            margin-bottom: 14px;
            font-size: 12.5px;
            transition: transform 0.2s;
        }

        /* 入力フォーム */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            background: #fff;
            padding: 10px;
            border-radius: 16px;
            border: 1px solid #ebe2d8;
        }
        .input-row-1 {
            display: flex;
            gap: 6px;
        }
        input[type="text"] {
            flex: 1;
            padding: 9px 12px;
            border: 1.5px solid #e8dfd8;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            background: #faf6f0;
            color: #4a3b32;
        }
        input[type="text"]:focus {
            border-color: #a07855;
            background: #ffffff;
        }
        .input-row-2 {
            display: flex;
            gap: 6px;
        }
        select {
            padding: 8px 10px;
            border: 1.5px solid #e8dfd8;
            border-radius: 12px;
            font-size: 11.5px;
            background: #faf6f0;
            color: #5c4333;
            outline: none;
            cursor: pointer;
            max-width: 45%;
        }
        .add-btn {
            flex: 1;
            padding: 8px 14px;
            background-color: #70523e;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: bold;
            white-space: nowrap;
        }
        .add-btn:hover { background-color: #5b402e; }

        /* タスクカード */
        .task-card {
            background: #faf6f0;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #ebe2d8;
            margin-bottom: 14px;
        }
        .category-title {
            font-size: 12.5px;
            font-weight: bold;
            color: #70523e;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* タブ */
        .tab-switch {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            background: #e8dfd8;
            padding: 3px;
            border-radius: 12px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 6px 8px;
            border-radius: 9px;
            font-size: 11.5px;
            font-weight: bold;
            color: #8c6d58;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #70523e;
        }

        /* 柔らかい朱色のタブバッジ */
        .tab-badge {
            background: #e06a55;
            color: white;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 9.5px;
            font-weight: normal;
        }

        /* タスクリスト */
        ul { list-style: none; padding: 0; margin: 0; min-height: 10px; }
        .hidden-list { display: none; }
        li {
            background: #ffffff;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0e8e0;
            font-size: 12.5px;
            transition: transform 0.15s, box-shadow 0.15s, background-color 0.2s;
            user-select: none;
            touch-action: pan-y;
        }
        li.dragging {
            opacity: 0.7;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(112, 82, 62, 0.15);
            background: #fffdfb;
            border: 1.5px dashed #a07855;
        }
        li span.text {
            cursor: pointer;
            flex: 1;
            word-break: break-all;
        }
        .day-badge {
            font-size: 10px;
            background: #e8dfd8;
            color: #70523e;
            padding: 2px 6px;
            border-radius: 8px;
            margin-right: 6px;
            font-weight: bold;
        }

        /* 達成済みデザイン */
        li.completed {
            background: #f5f0eb;
            text-decoration: line-through;
            color: #b0a398;
            border-color: #e8dfd8;
        }

        /* 柔らかい朱色の未達成デザイン */
        li.missed {
            background: #fdf6f5;
            border: 1.5px solid #f2d1ca;
        }
        .missed-badge {
            font-size: 9.5px;
            background: #f8ded8;
            color: #b84a39;
            padding: 2px 5px;
            border-radius: 6px;
            margin-right: 6px;
            font-weight: bold;
        }

        .delete-btn {
            background-color: transparent;
            color: #c4aead;
            border: none;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover { color: #d63031; }

        /* スケジュール メモ */
        .schedule-memo-box {
            background: #faf6f0;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #ebe2d8;
            margin-bottom: 0;
        }
        .memo-title {
            font-size: 12px;
            font-weight: bold;
            color: #70523e;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        textarea {
            width: 100%;
            height: 75px;
            border: 1.5px solid #e8dfd8;
            border-radius: 12px;
            padding: 8px;
            font-size: 12px;
            color: #4a3b32;
            background: #ffffff;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div id="toastNotification" class="toast-notification"></div>

    <div class="container">
        <div class="header-top">
            <h1>liste de tâches ☕</h1>
            <div class="streak-badge" id="streakDisplay">🔥 0日連続</div>
        </div>

        <!-- 達成率 -->
        <div class="progress-box">
            <div class="progress-info">
                <span id="progressMsg">☕ à votre rythme</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- 動物の褒め言葉エリア -->
        <div class="pet-praise" id="praiseBox">
            🐶「今日もマイペースにいこうね」
        </div>

        <!-- 入力フォーム -->
        <div class="input-group">
            <div class="input-row-1">
                <input type="text" id="taskInput" placeholder="新しいタスク...">
            </div>
            <div class="input-row-2">
                <select id="categorySelect" onchange="handleCategoryChange(this.value)">
                    <option value="daily">☀️ au quotidien</option>
                    <option value="weekly">📅 jours spécifiques</option>
                    <option value="weekend">🎈 le week-end</option>
                </select>
                <select id="daySelect" style="display: none;"></select>
                <button class="add-btn" onclick="addTask()">ajouter</button>
            </div>
        </div>

        <!-- ① 毎日すること -->
        <div class="task-card">
            <div class="category-title">☀️ au quotidien</div>
            <ul id="dailyList"></ul>
        </div>

        <!-- ② 特定の曜日 / 週末 -->
        <div class="task-card">
            <div class="tab-switch">
                <button class="tab-btn" id="tabWeekly" onclick="switchTab('weekly')">📅 jours spécifiques</button>
                <button class="tab-btn" id="tabWeekend" onclick="switchTab('weekend')">🎈 le week-end</button>
            </div>
            <ul id="weeklyList"></ul>
            <ul id="weekendList" class="hidden-list"></ul>
        </div>

        <!-- タイムスケジュール メモ -->
        <div class="schedule-memo-box">
            <div class="memo-title">
                <span>⏳ mon planning</span>
                <span style="font-weight:normal; font-size:10px; color:#a07855;" id="memoSavedStatus">enregistré</span>
            </div>
            <textarea id="scheduleMemo" placeholder="08:00 カフェ&#10;10:00 読書&#10;14:00 お買い物" oninput="saveMemo()"></textarea>
        </div>
    </div>

    <script>
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist();
        }

        let tasks = JSON.parse(localStorage.getItem('app_tasks_v3')) || [];
        let streakData = JSON.parse(localStorage.getItem('app_streak_data')) || { count: 0, lastLogicalDate: "" };

        const praises = [
            "🐶『すごーい！ひとつクリアだね！』",
            "🐱『さすが！素晴らしい集中力！』",
            "🐻『順調、順調！その調子♪』",
            "🐰『完璧！がんばり屋さんだね！』",
            "🐥『やったね！気持ちもスッキリ！』",
            "🐼『えらいっ！自分にご褒美あげてね！』"
        ];

        const streakMilestones = {
            1: "🐶『1日達成！幸先の良いスタートだね！』",
            2: "🐱『2日連続！その調子で続けていこう！』",
            3: "🐻『3日連続！素晴らしい習慣になってきたよ！』",
            5: "🐰『5日連続！！すごすぎる！大天才！』",
            10: "🐼『10日連続！！！神レベルの継続力！』",
            20: "🐥『20日連続！！！！自分を誇ってね！』",
            30: "🦁『30日連続！！！！！もはやマスターだよ！』"
        };

        function getLogicalDate(dateObj = new Date()) {
            const d = new Date(dateObj.getTime() - (4 * 60 + 30) * 60 * 1000);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function check430AMReset() {
            const currentLogical = getLogicalDate();
            const lastLogical = localStorage.getItem('app_last_logical');

            if (lastLogical && lastLogical !== currentLogical) {
                tasks.forEach(t => {
                    t.completed = false;
                    t.isMissed = false;
                });
                saveTasks();
            }
            localStorage.setItem('app_last_logical', currentLogical);
        }

        function getAutoTabCategory(now = new Date()) {
            const day = now.getDay();
            const hours = now.getHours();
            let hoursFromMon0 = (day === 0 ? 6 : day - 1) * 24 + hours;

            if (hoursFromMon0 >= 3 && hoursFromMon0 < 123) {
                return 'weekly';
            } else {
                return 'weekend';
            }
        }

        check430AMReset();
        renderTasks();
        loadMemo();
        updateStreakUI();
        handleCategoryChange('daily');

        const defaultTab = getAutoTabCategory();
        switchTab(defaultTab);

        setInterval(checkScheduledNotifications, 60000);

        function handleCategoryChange(val) {
            const daySelect = document.getElementById('daySelect');
            if (val === 'weekly') {
                daySelect.style.display = 'inline-block';
                daySelect.innerHTML = `
                    <option value="月">月曜日</option>
                    <option value="火">火曜日</option>
                    <option value="水">水曜日</option>
                    <option value="木">木曜日</option>
                    <option value="金">金曜日</option>
                `;
            } else if (val === 'weekend') {
                daySelect.style.display = 'inline-block';
                daySelect.innerHTML = `
                    <option value="土">土曜日</option>
                    <option value="日">日曜日</option>
                `;
            } else {
                daySelect.style.display = 'none';
            }
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;

            const category = document.getElementById('categorySelect').value;
            const dayOfWeek = document.getElementById('daySelect').value;

            const newTask = {
                id: Date.now(),
                text: text,
                category: category,
                dayOfWeek: (category === 'weekly' || category === 'weekend') ? dayOfWeek : '',
                completed: false,
                isMissed: false
            };

            tasks.push(newTask);
            saveTasks();
            renderTasks();

            input.value = '';
            if (category === 'weekly') switchTab('weekly');
            if (category === 'weekend') switchTab('weekend');
        }

        function renderTasks() {
            const dailyList = document.getElementById('dailyList');
            const weeklyList = document.getElementById('weeklyList');
            const weekendList = document.getElementById('weekendList');

            dailyList.innerHTML = '';
            weeklyList.innerHTML = '';
            weekendList.innerHTML = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.dataset.id = task.id;
                if (task.completed) li.classList.add('completed');
                if (task.isMissed) li.classList.add('missed');

                let dayBadgeHtml = task.dayOfWeek ? `<span class="day-badge">${task.dayOfWeek}</span>` : '';
                let missedBadgeHtml = task.isMissed ? `<span class="missed-badge">⚠️ 未達成</span>` : '';

                li.innerHTML = `
                    ${missedBadgeHtml}
                    ${dayBadgeHtml}
                    <span class="text" onclick="toggleTask(${task.id})">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
                `;

                if (task.category === 'daily') {
                    dailyList.appendChild(li);
                    setupDragAndDrop(li, dailyList);
                } else if (task.category === 'weekly') {
                    weeklyList.appendChild(li);
                    setupDragAndDrop(li, weeklyList);
                } else if (task.category === 'weekend') {
                    weekendList.appendChild(li);
                    setupDragAndDrop(li, weekendList);
                }
            });

            updateProgress();
            updateTabBadges();
        }

        // --- 長押し・ドラッグ＆ドロップ（移動機能） ---
        let dragSrcEl = null;
        let touchTimer = null;
        let draggedItem = null;
        let touchStartY = 0;

        function setupDragAndDrop(li, listEl) {
            li.setAttribute('draggable', true);

            li.addEventListener('dragstart', (e) => {
                dragSrcEl = li;
                li.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });

            li.addEventListener('dragend', () => {
                li.classList.remove('dragging');
                updateTasksOrder(listEl);
            });

            listEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(listEl, e.clientY);
                const dragging = document.querySelector('.dragging');
                if (dragging) {
                    if (afterElement == null) {
                        listEl.appendChild(dragging);
                    } else {
                        listEl.insertBefore(dragging, afterElement);
                    }
                }
            });

            li.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                touchStartY = e.touches[0].clientY;

                touchTimer = setTimeout(() => {
                    draggedItem = li;
                    li.classList.add('dragging');
                    if (navigator.vibrate) navigator.vibrate(40);
                }, 300);
            }, { passive: true });

            li.addEventListener('touchmove', (e) => {
                const touchY = e.touches[0].clientY;
                if (!draggedItem && Math.abs(touchY - touchStartY) > 10) {
                    clearTimeout(touchTimer);
                    return;
                }

                if (draggedItem) {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(listEl, touchY);
                    if (afterElement == null) {
                        listEl.appendChild(draggedItem);
                    } else {
                        listEl.insertBefore(draggedItem, afterElement);
                    }
                }
            }, { passive: false });

            li.addEventListener('touchend', () => {
                clearTimeout(touchTimer);
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                    draggedItem = null;
                    updateTasksOrder(listEl);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('li:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateTasksOrder(listEl) {
            const category = listEl.id.replace('List', '');
            const newOrderIds = [...listEl.querySelectorAll('li')].map(li => Number(li.dataset.id));

            const categoryTasks = tasks.filter(t => t.category === category);
            const otherTasks = tasks.filter(t => t.category !== category);

            const reorderedCategoryTasks = [];
            newOrderIds.forEach(id => {
                const found = categoryTasks.find(t => t.id === id);
                if (found) reorderedCategoryTasks.push(found);
            });

            tasks = [...otherTasks, ...reorderedCategoryTasks];
            saveTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) task.isMissed = false;
                saveTasks();
                renderTasks();

                if (task.completed) {
                    checkStreakOnTaskComplete();
                }
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('app_tasks_v3', JSON.stringify(tasks));
        }

        function checkStreakOnTaskComplete() {
            const todayLogical = getLogicalDate();
            const dailyTasks = tasks.filter(t => t.category === 'daily');

            if (dailyTasks.length > 0 && dailyTasks.every(t => t.completed)) {
                if (streakData.lastLogicalDate !== todayLogical) {
                    streakData.count += 1;
                    streakData.lastLogicalDate = todayLogical;
                    localStorage.setItem('app_streak_data', JSON.stringify(streakData));
                    updateStreakUI();

                    if (streakMilestones[streakData.count]) {
                        document.getElementById('praiseBox').innerText = streakMilestones[streakData.count];
                        return;
                    }
                }
            }

            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
            document.getElementById('praiseBox').innerText = randomPraise;
        }

        function updateStreakUI() {
            document.getElementById('streakDisplay').innerText = `🔥 ${streakData.count}日連続`;
        }

        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentText').innerText = percent + '%';

            const msgEl = document.getElementById('progressMsg');
            if (total === 0) msgEl.innerText = '☕ à votre rythme';
            else if (percent === 100) msgEl.innerText = '🎉 tout est fait !';
            else if (percent >= 50) msgEl.innerText = '✨ à mi-chemin !';
            else msgEl.innerText = '🐾 un pas à la fois';
        }

        function updateTabBadges() {
            const weeklyUncompleted = tasks.filter(t => t.category === 'weekly' && !t.completed).length;
            const weekendUncompleted = tasks.filter(t => t.category === 'weekend' && !t.completed).length;

            const tabWeekly = document.getElementById('tabWeekly');
            const tabWeekend = document.getElementById('tabWeekend');

            const badgeWeekly = weeklyUncompleted > 0 ? `<span class="tab-badge">🐾${weeklyUncompleted}</span>` : '';
            const badgeWeekend = weekendUncompleted > 0 ? `<span class="tab-badge">🐾${weekendUncompleted}</span>` : '';

            tabWeekly.innerHTML = `📅 jours spécifiques ${badgeWeekly}`;
            tabWeekend.innerHTML = `🎈 le week-end ${badgeWeekend}`;
        }

        function switchTab(tab) {
            const weeklyList = document.getElementById('weeklyList');
            const weekendList = document.getElementById('weekendList');
            const tabWeekly = document.getElementById('tabWeekly');
            const tabWeekend = document.getElementById('tabWeekend');

            if (tab === 'weekly') {
                weeklyList.classList.remove('hidden-list');
                weekendList.classList.add('hidden-list');
                tabWeekly.classList.add('active');
                tabWeekend.classList.remove('active');
            } else {
                weeklyList.classList.add('hidden-list');
                weekendList.classList.remove('hidden-list');
                tabWeekly.classList.remove('active');
                tabWeekend.classList.add('active');
            }
        }

        function saveMemo() {
            const memoText = document.getElementById('scheduleMemo').value;
            localStorage.setItem('todo_schedule_memo', memoText);
            const status = document.getElementById('memoSavedStatus');
            status.innerText = '...';
            setTimeout(() => { status.innerText = 'enregistré'; }, 400);
        }

        function loadMemo() {
            const saved = localStorage.getItem('todo_schedule_memo');
            if (saved !== null) document.getElementById('scheduleMemo').value = saved;
        }

        function showToast(text) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4500);
        }

        function getUncompletedTasksForToday() {
            const days = ["日", "月", "火", "水", "木", "金", "土"];
            const todayName = days[new Date().getDay()];

            return tasks.filter(t => {
                if (t.completed) return false;
                if (t.category === 'daily') return true;
                if (t.category === 'weekly' && t.dayOfWeek === todayName) return true;
                if (t.category === 'weekend' && t.dayOfWeek === todayName) return true;
                return false;
            });
        }

        function get22PMMsg(uncompletedTasks) {
            const count = uncompletedTasks.length;
            if (count === 0) return "すべてのタスクが完了しています！お見事！☕";

            const firstName = uncompletedTasks[0].text;
            if (count === 1) {
                const singleTemplates = [
                    `${firstName} をやり忘れているよ！あと少しだよ！☕`,
                    `まだ ${firstName} が終わっていないみたい！あと少しだよ！✨`,
                    `あともう少し！ ${firstName} をクリアしてスッキリしようね！🌙`
                ];
                return singleTemplates[Math.floor(Math.random() * singleTemplates.length)];
            } else {
                const multiTemplates = [
                    `${firstName} など ${count}個のタスクが残っているよ！あと少しだよ！☕`,
                    `まだ ${firstName} など ${count}個のタスクがあるよ！あと少しだよ！✨`,
                    `あともう少し！ ${firstName} など ${count}個のタスクを終わらせようね！🌙`
                ];
                return multiTemplates[Math.floor(Math.random() * multiTemplates.length)];
            }
        }

        function get23PMMsg(uncompletedTasks) {
            const count = uncompletedTasks.length;
            if (count === 0) return "すべてのタスクが完了しています！素晴らしいです！☕";

            const firstName = uncompletedTasks[0].text;
            if (count === 1) {
                const singleTemplates = [
                    `${firstName} が未達成だよ！☕`,
                    `${firstName} が未達成みたい！クリアしよう！✨`,
                    `今日は ${firstName} が未達成だよ！頑張ったね！🌙`
                ];
                return singleTemplates[Math.floor(Math.random() * singleTemplates.length)];
            } else {
                const multiTemplates = [
                    `${firstName} など ${count}個のタスクが未達成だよ！☕`,
                    `${firstName} など ${count}個のタスクが未達成だよ！クリアしよう！✨`,
                    `今日は ${firstName} など ${count}個のタスクが未達成だよ！お疲れ様！🌙`
                ];
                return multiTemplates[Math.floor(Math.random() * multiTemplates.length)];
            }
        }

        function checkScheduledNotifications() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const todayStr = getLogicalDate(now);

            if (minutes === 0) {
                if (hours === 22) {
                    const last22 = localStorage.getItem('app_last_notified_22pm');
                    if (last22 !== todayStr) {
                        const uncompleted = getUncompletedTasksForToday();
                        if (uncompleted.length > 0) {
                            sendNotification(get22PMMsg(uncompleted));
                            localStorage.setItem('app_last_notified_22pm', todayStr);
                        }
                    }
                } else if (hours === 23) {
                    const last23 = localStorage.getItem('app_last_notified_23pm');
                    if (last23 !== todayStr) {
                        const uncompleted = getUncompletedTasksForToday();
                        if (uncompleted.length > 0) {
                            sendNotification(get23PMMsg(uncompleted));
                            localStorage.setItem('app_last_notified_23pm', todayStr);
                        }
                    }
                }
            }
        }

        function sendNotification(msgText) {
            showToast(msgText);

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("liste de tâches ☕", {
                    body: msgText,
                    icon: "https://fav.farm/☕"
                });
            }
        }
    </script>
</body>
</html>
