<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 検索エンジンにヒットしない設定 -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liste de tâches ☕</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", sans-serif;
            background-color: #f5f0eb;
            min-height: 100vh;
            margin: 0;
            padding: 25px 15px;
            color: #4a3b32;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 10px 25px rgba(100, 80, 70, 0.06);
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            height: fit-content;
        }

        @keyframes popIn {
            0% { transform: scale(0.92) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* アプリ内トースト通知 */
        .toast-notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #70523e;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(112, 82, 62, 0.25);
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 88%;
            max-width: 380px;
            text-align: center;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .toast-notification.show {
            top: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: #70523e;
            font-size: 20px;
            letter-spacing: 1px;
            margin: 0;
            font-weight: 700;
        }

        /* 連続達成日数バッジ */
        .streak-badge {
            background: #fff8e7;
            border: 1px solid #f3e5ab;
            color: #d68910;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* 達成率プログレスバー */
        .progress-box {
            background: #faf6f0;
            border-radius: 18px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #ebe2d8;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: #70523e;
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            background: #e8dfd8;
            height: 8px;
            border-radius: 8px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: #a07855;
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        /* 動物の褒め言葉エリア */
        .pet-praise {
            background: #fff;
            border: 1.5px dashed #d7ccc8;
            border-radius: 16px;
            padding: 10px 12px;
            text-align: center;
            font-weight: 600;
            color: #8c6d58;
            margin-bottom: 14px;
            font-size: 12.5px;
            transition: transform 0.2s;
        }

        /* テンプレートエリア */
        .template-section {
            margin-bottom: 14px;
            background: #faf6f0;
            padding: 10px 12px;
            border-radius: 16px;
        }
        .template-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .template-title {
            font-size: 11px;
            color: #8c6d58;
            font-weight: bold;
        }
        .tpl-toggle-edit {
            background: none;
            border: none;
            color: #a07855;
            font-size: 10px;
            cursor: pointer;
            text-decoration: underline;
        }
        .template-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tpl-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            border: 1px solid #e0d5c9;
            border-radius: 18px;
            padding: 4px 10px;
            font-size: 11.5px;
            color: #5c4333;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tpl-chip:hover {
            background: #70523e;
            color: #fff;
        }
        .tpl-edit-btn, .tpl-del-btn {
            font-size: 10px;
            padding: 0 2px;
            color: #999;
        }
        .tpl-edit-btn:hover { color: #a07855; }
        .tpl-del-btn:hover { color: #d63031; }

        .add-tpl-btn {
            background: #e8dfd8;
            border: none;
            border-radius: 18px;
            padding: 4px 8px;
            font-size: 11px;
            color: #70523e;
            cursor: pointer;
        }

        /* 入力フォーム */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            background: #fff;
            padding: 10px;
            border-radius: 16px;
            border: 1px solid #ebe2d8;
        }
        .input-row-1 {
            display: flex;
            gap: 6px;
        }
        input[type="text"] {
            flex: 1;
            padding: 9px 12px;
            border: 1.5px solid #e8dfd8;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            background: #faf6f0;
            color: #4a3b32;
        }
        input[type="text"]:focus {
            border-color: #a07855;
            background: #ffffff;
        }
        .input-row-2 {
            display: flex;
            gap: 6px;
        }
        select {
            padding: 8px 10px;
            border: 1.5px solid #e8dfd8;
            border-radius: 12px;
            font-size: 11.5px;
            background: #faf6f0;
            color: #5c4333;
            outline: none;
            cursor: pointer;
        }
        .add-btn {
            flex: 1;
            padding: 8px 14px;
            background-color: #70523e;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: bold;
        }
        .add-btn:hover { background-color: #5b402e; }

        /* タスクカード */
        .task-card {
            background: #faf6f0;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #ebe2d8;
            margin-bottom: 14px;
        }
        .category-title {
            font-size: 12.5px;
            font-weight: bold;
            color: #70523e;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* タブ */
        .tab-switch {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            background: #e8dfd8;
            padding: 3px;
            border-radius: 12px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 5px 8px;
            border-radius: 9px;
            font-size: 11.5px;
            font-weight: bold;
            color: #8c6d58;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #70523e;
        }

        /* タスクリスト */
        ul { list-style: none; padding: 0; margin: 0; }
        .hidden-list { display: none; }
        li {
            background: #ffffff;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0e8e0;
            font-size: 12.5px;
            transition: all 0.2s;
        }
        li span.text {
            cursor: pointer;
            flex: 1;
            word-break: break-all;
        }
        .day-badge {
            font-size: 10px;
            background: #e8dfd8;
            color: #70523e;
            padding: 2px 6px;
            border-radius: 8px;
            margin-right: 6px;
            font-weight: bold;
        }

        /* 達成済みデザイン */
        li.completed {
            background: #f5f0eb;
            text-decoration: line-through;
            color: #b0a398;
            border-color: #e8dfd8;
        }

        /* 4時時点での未達成（持ち越し）デザイン */
        li.missed {
            background: #fff5f5;
            border: 1.5px solid #f5c6cb;
        }
        .missed-badge {
            font-size: 9.5px;
            background: #f8d7da;
            color: #721c24;
            padding: 2px 5px;
            border-radius: 6px;
            margin-right: 6px;
            font-weight: bold;
        }

        .delete-btn {
            background-color: transparent;
            color: #c4aead;
            border: none;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover { color: #d63031; }

        /* スケジュール メモ */
        .schedule-memo-box {
            background: #faf6f0;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #ebe2d8;
            margin-bottom: 12px;
        }
        .memo-title {
            font-size: 12px;
            font-weight: bold;
            color: #70523e;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        textarea {
            width: 100%;
            height: 75px;
            border: 1.5px solid #e8dfd8;
            border-radius: 12px;
            padding: 8px;
            font-size: 12px;
            color: #4a3b32;
            background: #ffffff;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }

        /* デモ通知ボタン */
        .demo-bar {
            text-align: center;
        }
        .demo-btn {
            background: #f0e8e0;
            border: none;
            color: #8c6d58;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .demo-btn:hover { background: #e8dfd8; }
    </style>
</head>
<body>
    <!-- アプリ内トースト通知 -->
    <div id="toastNotification" class="toast-notification"></div>

    <div class="container">
        <div class="header-top">
            <h1>liste de tâches ☕</h1>
            <div class="streak-badge" id="streakDisplay">🔥 0日連続</div>
        </div>

        <!-- 達成率 -->
        <div class="progress-box">
            <div class="progress-info">
                <span id="progressMsg">☕ à votre rythme</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- 動物の褒め言葉エリア -->
        <div class="pet-praise" id="praiseBox">
            🐶「今日もマイペースにいこうね」
        </div>

        <!-- テンプレートエリア -->
        <div class="template-section">
            <div class="template-header">
                <span class="template-title">✨ modèles</span>
                <button class="tpl-toggle-edit" id="editToggleBtn" onclick="toggleEditMode()">modifier</button>
            </div>
            <div class="template-buttons" id="templateList"></div>
        </div>

        <!-- 入力フォーム -->
        <div class="input-group">
            <div class="input-row-1">
                <input type="text" id="taskInput" placeholder="新しいタスク...">
            </div>
            <div class="input-row-2">
                <select id="categorySelect" onchange="handleCategoryChange(this.value)">
                    <option value="daily">☀️ au quotidien</option>
                    <option value="weekly">📅 jours spécifiques</option>
                    <option value="weekend">🎈 le week-end</option>
                </select>
                <select id="daySelect" style="display: none;">
                    <option value="月">月曜日 (Lun)</option>
                    <option value="火">火曜日 (Mar)</option>
                    <option value="水">水曜日 (Mer)</option>
                    <option value="木">木曜日 (Jeu)</option>
                    <option value="金">金曜日 (Ven)</option>
                    <option value="土">土曜日 (Sam)</option>
                    <option value="日">日曜日 (Dim)</option>
                </select>
                <button class="add-btn" onclick="addTask()">ajouter</button>
            </div>
        </div>

        <!-- ① 毎日すること -->
        <div class="task-card">
            <div class="category-title">☀️ au quotidien</div>
            <ul id="dailyList"></ul>
        </div>

        <!-- ② 特定の曜日 / 週末 -->
        <div class="task-card">
            <div class="tab-switch">
                <button class="tab-btn active" id="tabWeekly" onclick="switchTab('weekly')">📅 jours spécifiques</button>
                <button class="tab-btn" id="tabWeekend" onclick="switchTab('weekend')">🎈 le week-end</button>
            </div>
            <ul id="weeklyList"></ul>
            <ul id="weekendList" class="hidden-list"></ul>
        </div>

        <!-- タイムスケジュール メモ -->
        <div class="schedule-memo-box">
            <div class="memo-title">
                <span>⏳ mon planning</span>
                <span style="font-weight:normal; font-size:10px; color:#a07855;" id="memoSavedStatus">自動保存完了</span>
            </div>
            <textarea id="scheduleMemo" placeholder="08:00 カフェ&#10;10:00 読書&#10;14:00 お買い物" oninput="saveMemo()"></textarea>
        </div>

        <!-- スマホ通知デモボタン -->
        <div class="demo-bar">
            <button class="demo-btn" onclick="triggerNotificationDemo()">🔔 通知デモを試す</button>
        </div>
    </div>

    <script>
        // --- ブラウザストレージの永続化要請（自動削除の防止） ---
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist();
        }

        // --- データ管理 ---
        let tasks = JSON.parse(localStorage.getItem('app_tasks_v3')) || [];
        let templates = JSON.parse(localStorage.getItem('app_templates')) || ["☕ カフェタイム", "🧹 お部屋掃除", "📖 読書・勉強"];
        let streakData = JSON.parse(localStorage.getItem('app_streak_data')) || { count: 0, lastLogicalDate: "" };
        let isEditMode = false;

        const praises = [
            "🐶『すごーい！ひとつクリアだね！』",
            "🐱『さすが！素晴らしい集中力！』",
            "🐻『順調、順調！その調子♪』",
            "🐰『完璧！がんばり屋さんだね！』",
            "🐥『やったね！気持ちもスッキリ！』",
            "🐼『えらいっ！自分にご褒美あげてね！』"
        ];

        const streakMilestones = {
            1: "🐶『1日達成！幸先の良いスタートだね！』",
            2: "🐱『2日連続！その調子で続けていこう！』",
            3: "🐻『3日連続！素晴らしい習慣になってきたよ！』",
            5: "🐰『5日連続！！すごすぎる！大天才！』",
            10: "🐼『10日連続！！！神レベルの継続力！』",
            20: "🐥『20日連続！！！！自分を誇ってね！』",
            30: "🦁『30日連続！！！！！もはやマスターだよ！』"
        };

        // --- 4:00 AM 基準の日付取得 ---
        function getLogicalDate(dateObj = new Date()) {
            const d = new Date(dateObj.getTime() - 4 * 60 * 60 * 1000);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // --- 4時またぎのリセットチェック ---
        function check4AMReset() {
            const currentLogical = getLogicalDate();
            const lastLogical = localStorage.getItem('app_last_logical');

            if (lastLogical && lastLogical !== currentLogical) {
                tasks.forEach(t => {
                    if (t.completed) {
                        t.completed = false;
                        t.isMissed = false;
                    } else {
                        t.isMissed = true;
                    }
                });
                saveTasks();
            }
            localStorage.setItem('app_last_logical', currentLogical);
        }

        // --- 初期化 ---
        check4AMReset();
        renderTemplates();
        renderTasks();
        loadMemo();
        updateStreakUI();

        // --- タスク追加・描画 ---
        function handleCategoryChange(val) {
            document.getElementById('daySelect').style.display = (val === 'weekly') ? 'inline-block' : 'none';
        }

        function addTask(textValue = null) {
            const input = document.getElementById('taskInput');
            const text = textValue || input.value.trim();
            if (!text) return;

            const category = document.getElementById('categorySelect').value;
            const dayOfWeek = document.getElementById('daySelect').value;

            const newTask = {
                id: Date.now(),
                text: text,
                category: category,
                dayOfWeek: (category === 'weekly') ? dayOfWeek : '',
                completed: false,
                isMissed: false
            };

            tasks.push(newTask);
            saveTasks();
            renderTasks();

            if (!textValue) input.value = '';
            if (category === 'weekly') switchTab('weekly');
            if (category === 'weekend') switchTab('weekend');
        }

        function renderTasks() {
            const dailyList = document.getElementById('dailyList');
            const weeklyList = document.getElementById('weeklyList');
            const weekendList = document.getElementById('weekendList');

            dailyList.innerHTML = '';
            weeklyList.innerHTML = '';
            weekendList.innerHTML = '';

            const dayOrder = { '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6, '日': 7 };
            tasks.sort((a, b) => (dayOrder[a.dayOfWeek] || 0) - (dayOrder[b.dayOfWeek] || 0));

            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');
                if (task.isMissed) li.classList.add('missed');

                let dayBadgeHtml = task.dayOfWeek ? `<span class="day-badge">${task.dayOfWeek}</span>` : '';
                let missedBadgeHtml = task.isMissed ? `<span class="missed-badge">⚠️ 未達成</span>` : '';

                li.innerHTML = `
                    ${missedBadgeHtml}
                    ${dayBadgeHtml}
                    <span class="text" onclick="toggleTask(${task.id})">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
                `;

                if (task.category === 'daily') dailyList.appendChild(li);
                else if (task.category === 'weekly') weeklyList.appendChild(li);
                else if (task.category === 'weekend') weekendList.appendChild(li);
            });

            updateProgress();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) task.isMissed = false;
                saveTasks();
                renderTasks();

                if (task.completed) {
                    checkStreakOnTaskComplete();
                }
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('app_tasks_v3', JSON.stringify(tasks));
        }

        // --- 連続達成カウント ---
        function checkStreakOnTaskComplete() {
            const todayLogical = getLogicalDate();
            const dailyTasks = tasks.filter(t => t.category === 'daily');

            if (dailyTasks.length > 0 && dailyTasks.every(t => t.completed)) {
                if (streakData.lastLogicalDate !== todayLogical) {
                    streakData.count += 1;
                    streakData.lastLogicalDate = todayLogical;
                    localStorage.setItem('app_streak_data', JSON.stringify(streakData));
                    updateStreakUI();

                    if (streakMilestones[streakData.count]) {
                        document.getElementById('praiseBox').innerText = streakMilestones[streakData.count];
                        return;
                    }
                }
            }

            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
            document.getElementById('praiseBox').innerText = randomPraise;
        }

        function updateStreakUI() {
            document.getElementById('streakDisplay').innerText = `🔥 ${streakData.count}日連続`;
        }

        // --- 達成率更新 ---
        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentText').innerText = percent + '%';

            const msgEl = document.getElementById('progressMsg');
            if (total === 0) msgEl.innerText = '☕ à votre rythme';
            else if (percent === 100) msgEl.innerText = '🎉 tout est fait !';
            else if (percent >= 50) msgEl.innerText = '✨ à mi-chemin !';
            else msgEl.innerText = '🐾 un pas à la fois';
        }

        // --- テンプレート編集 ---
        function renderTemplates() {
            const container = document.getElementById('templateList');
            container.innerHTML = '';

            templates.forEach((tpl, index) => {
                const chip = document.createElement('div');
                chip.className = 'tpl-chip';
                if (isEditMode) {
                    chip.innerHTML = `
                        <span>${tpl}</span>
                        <span class="tpl-edit-btn" onclick="editTemplate(${index}, event)">✏️</span>
                        <span class="tpl-del-btn" onclick="deleteTemplate(${index}, event)">✕</span>
                    `;
                } else {
                    chip.innerText = tpl;
                    chip.onclick = () => addTask(tpl);
                }
                container.appendChild(chip);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-tpl-btn';
            addBtn.innerText = '+ ajouter';
            addBtn.onclick = addNewTemplate;
            container.appendChild(addBtn);
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.getElementById('editToggleBtn').innerText = isEditMode ? 'valider' : 'modifier';
            renderTemplates();
        }

        function addNewTemplate() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim() || prompt('新しいテンプレート名:');
            if (text) {
                templates.push(text);
                saveTemplates();
                input.value = '';
                renderTemplates();
            }
        }

        function editTemplate(index, event) {
            event.stopPropagation();
            const newText = prompt('テンプレート変更:', templates[index]);
            if (newText && newText.trim()) {
                templates[index] = newText.trim();
                saveTemplates();
                renderTemplates();
            }
        }

        function deleteTemplate(index, event) {
            event.stopPropagation();
            templates.splice(index, 1);
            saveTemplates();
            renderTemplates();
        }

        function saveTemplates() {
            localStorage.setItem('app_templates', JSON.stringify(templates));
        }

        // --- タブ切り替え ---
        function switchTab(tab) {
            const weeklyList = document.getElementById('weeklyList');
            const weekendList = document.getElementById('weekendList');
            const tabWeekly = document.getElementById('tabWeekly');
            const tabWeekend = document.getElementById('tabWeekend');

            if (tab === 'weekly') {
                weeklyList.classList.remove('hidden-list');
                weekendList.classList.add('hidden-list');
                tabWeekly.classList.add('active');
                tabWeekend.classList.remove('active');
            } else {
                weeklyList.classList.add('hidden-list');
                weekendList.classList.remove('hidden-list');
                tabWeekly.classList.remove('active');
                tabWeekend.classList.remove('active');
            }
        }

        // --- メモ自動保存 ---
        function saveMemo() {
            const memoText = document.getElementById('scheduleMemo').value;
            localStorage.setItem('todo_schedule_memo', memoText);
            const status = document.getElementById('memoSavedStatus');
            status.innerText = '...';
            setTimeout(() => { status.innerText = '自動保存完了'; }, 400);
        }

        function loadMemo() {
            const saved = localStorage.getItem('todo_schedule_memo');
            if (saved !== null) document.getElementById('scheduleMemo').value = saved;
        }

        // --- アプリ内トースト通知の表示 ---
        function showToast(text) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4500);
        }

        // --- スマホ通知デモ機能（iOS・プライベートモード対応） ---
        function triggerNotificationDemo() {
            const days = ["日", "月", "火", "水", "木", "金", "土"];
            const todayName = days[new Date().getDay()];
            const demoMsg = `🐾 今日(${todayName}曜日)のタスクがあるよ！一緒に楽しくがんばろうね♪`;

            // 1. どんな環境でも必ず画面上に可愛いトースト通知を表示（体験用）
            showToast(`☕ liste de tâches\n${demoMsg}`);

            // 2. Web Notification API（システム通知）が利用可能な場合
            if ("Notification" in window && Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        new Notification("liste de tâches ☕", {
                            body: demoMsg,
                            icon: "https://fav.farm/☕"
                        });
                    }
                });
            } else {
                // iPhoneのSafari / プライベートモード等で端末通知が使えない場合の案内
                setTimeout(() => {
                    alert("💡 iPhoneでシステム通知を受け取るには：\n\n1. Safariの「通常モード」で開く\n2. 下部の共有ボタン（□↑）から「ホーム画面に追加」する\n\n※プライベートモードや普通のWebタブでは、iPhoneの仕様により端末への通知が制限されます。");
                }, 800);
            }
        }
    </script>
</body>
